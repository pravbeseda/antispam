name: Antispam
options:
  bundleIdPrefix: com.kalugaman.antispam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP_ID: $(TeamIdentifierPrefix)com.kalugaman.antispam
    BUNDLE_ID_BASE: com.kalugaman.antispam
    APP_DISPLAY_NAME: Antispam
  configs:
    # A distinct ID keeps a development build from competing with the installed extension in Mail.
    Debug:
      BUNDLE_ID_BASE: com.kalugaman.antispam.debug
      APP_DISPLAY_NAME: Antispam Debug
packages:
  AntispamCore:
    path: Packages/AntispamCore
targets:
  Antispam:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: AntispamMailExtension
      - package: AntispamCore
  AntispamMailExtension:
    type: app-extension
    platform: macOS
    sources: [MailExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).mail-extension
    info:
      path: MailExtension/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.email.extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MailExtension
          NSExtensionAttributes:
            MEExtensionCapabilities: [MEMessageActionHandler]
    entitlements:
      path: MailExtension/MailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: AntispamCore
